
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asama_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asama_user
      POSTGRES_PASSWORD: asama_password
      POSTGRES_DB: asama_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asama_user -d asama_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: asama_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
